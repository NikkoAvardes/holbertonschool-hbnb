<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>List of Places</title>
	<link rel="icon" type="image/png" href="/static/images/icon.png">
	<link rel="stylesheet" href="/static/styles.css">
</head>

<body>
	<header>
		<div>
			<a href="index.html"><img src="/static/images/logo.png" alt="logo-Hbnb" class="logo"></a>
		</div>
		<nav>
			<!-- Barre de navigation principale -->
			<a href="index.html">Home</a>
			<a href="login.html" id="login-link" class="login-button">Login</a>

		<!-- Contenu principal de la page d'accueil -->
		<section id="filter">
			<h2>Available Places</h2>
			<label for="price-filter">Filter Price:</label>

				<option value="10">$10</option>
				<option value="50">$50</option>
				<option value="100">$100</option>
			</select>
		</section>
		<section id="places-list">
			<!-- Places will be dynamically loaded here -->
		</section>

	<script src="/static/scripts.js"></script>
	<!-- Footer -->
	<footer>
		<p>© 2025 All rights reserved</p>
	</footer>
