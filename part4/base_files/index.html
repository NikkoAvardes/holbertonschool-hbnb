<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBNB - List of Places</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon.png">
</head>
<body>
    <header>
        <img src="logo.png" alt="Application Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" id="login-link" class="login-button" style="display: none;">Login</a>
            <a href="#" id="logout-button" class="login-button" style="display: none;">Logout</a>
        </nav>
    </header>

    <main>
        <section class="filter-controls">
            <h2>Filter Places</h2>
            <label for="price-filter">Max Price Per Night:</label>
            <select id="price-filter">
                <option value="all">All</option>
                <option value="10">Up to 10</option>
                <option value="50">Up to 50</option>
                <option value="100">Up to 100</option>
            </select>
        </section>
        
        <section id="places-list" class="places-grid">
            </section>
    </main>

    <footer>
        <p>&copy; 2025 HBNB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
